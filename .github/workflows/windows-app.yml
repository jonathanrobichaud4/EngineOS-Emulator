# Builds the Windows app with Mono and publishes it as the "windows-app" release:
# https://github.com/jonathanrobichaud4/EngineOS-Emulator/releases/download/windows-app/EngineOSEmulator.exe
name: Windows app
on:
  push:
    branches: [main]
    paths: ["windows/EngineOSEmulator.cs", "windows/app.ico", "windows/build.sh", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-devel >/dev/null
      - name: Build
        shell: bash
        run: |
          if ! BUILD_COMMIT=${{ github.sha }} windows/build.sh > build.log 2>&1; then
            cat build.log
            grep -E '\(([0-9]+),([0-9]+)\): error ' build.log | head -30 |
              sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$/::error file=windows\/\1,line=\2,col=\3::\4/' || true
            exit 1
          fi
          cat build.log
      - uses: actions/upload-artifact@v4
        with:
          name: EngineOSEmulator-windows
          path: windows/EngineOSEmulator.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="The EngineOS Emulator app for Windows 10 and 11 (runs the emulator in WSL), built from main. Download EngineOSEmulator.exe and run it. Windows may warn the first time because it isn't signed: More info, then Run anyway."
          gh release view windows-app >/dev/null 2>&1 || gh release create windows-app --title "Windows app" --notes "$NOTES"
          gh release edit windows-app --notes "$NOTES"
          gh release upload windows-app windows/EngineOSEmulator.exe --clobber
          # Apps from before the rename (SC LIVE 4 Emulator) download the old name to update.
          cp windows/EngineOSEmulator.exe SCLive4Emulator.exe
          gh release upload windows-app SCLive4Emulator.exe --clobber
          # Last, so an app that sees the new version can already download it.
          echo "${{ github.sha }}" > version.txt
          gh release upload windows-app version.txt --clobber
