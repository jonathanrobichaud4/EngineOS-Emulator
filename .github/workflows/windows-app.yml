# Builds the Windows app with Mono and publishes it as the "windows-app" release:
# https://github.com/jonathanrobichaud4/sclive4-emulator/releases/download/windows-app/SCLive4Emulator.exe
name: Windows app
on:
  push:
    branches: [main]
    paths: ["windows/SCLive4Emulator.cs", "windows/app.ico", "windows/build.sh", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-devel >/dev/null
      - name: Build
        shell: bash
        run: |
          if ! windows/build.sh > build.log 2>&1; then
            cat build.log
            grep -E '\(([0-9]+),([0-9]+)\): error ' build.log | head -30 |
              sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$/::error file=windows\/\1,line=\2,col=\3::\4/' || true
            exit 1
          fi
          cat build.log
      - uses: actions/upload-artifact@v4
        with:
          name: SCLive4Emulator-windows
          path: windows/SCLive4Emulator.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-app >/dev/null 2>&1 ||
            gh release create windows-app --title "Windows app" --notes "The SC LIVE 4 Emulator app for Windows 10 and 11 (runs the emulator in WSL), built from main. Download SCLive4Emulator.exe and run it. Windows may warn the first time because it isn't signed: More info, then Run anyway."
          gh release upload windows-app windows/SCLive4Emulator.exe --clobber
