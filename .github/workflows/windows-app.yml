# Test build of the Windows app and its installer on every change, kept as workflow artifacts.
# Releases are made by release.yml when VERSION changes.
name: Windows app
on:
  push:
    branches: [main]
    paths: ["apps/windows/**", "models/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono and NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs mono-devel libmono-system-web-extensions4.0-cil nsis >/dev/null
      - name: Build
        shell: bash
        run: |
          if ! BUILD_COMMIT=${{ github.sha }} apps/windows/build.sh > build.log 2>&1; then
            cat build.log
            grep -E '\(([0-9]+),([0-9]+)\): error ' build.log | head -30 |
              sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$/::error file=apps\/windows\/\1,line=\2,col=\3::\4/' || true
            exit 1
          fi
          cat build.log
      - name: Installer
        run: makensis -V2 -DVERSION="$(cat VERSION 2>/dev/null || echo 0.0.0)" apps/windows/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: EngineOSEmulator-windows
          path: |
            apps/windows/EngineOSEmulator.exe
            apps/windows/EngineOSEmulator-Setup.exe
