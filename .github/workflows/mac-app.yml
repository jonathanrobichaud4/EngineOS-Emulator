# Test build of the Mac app on every change: compiles it, packages it and takes a screenshot,
# kept as workflow artifacts. Releases are made by release.yml when VERSION changes.
name: Mac app
on:
  push:
    branches: [main]
    paths: ["apps/mac/**", "models/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          # Compiler errors become annotations, readable without logging in.
          if ! BUILD_COMMIT=${{ github.sha }} apps/mac/app/build.sh "$PWD/build" > build.log 2>&1; then
            cat build.log
            grep -E '^[^ ]+:[0-9]+:[0-9]+: error: ' build.log | head -30 |
              sed -E 's#^(/[^:]*/)?(Sources/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=apps/mac/app/\2,line=\3,col=\4::\5#' || true
            echo "::error::build failed: $(grep -m1 -E 'error' build.log | cut -c1-300)"
            exit 1
          fi
          cat build.log
          grep -E ': warning: ' build.log | head -20 |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): warning: (.*)$/::warning file=\1,line=\2,col=\3::\4/' || true
      # Package first: the screenshot run below opens the app, and nothing it does may end up
      # in the zip.
      - name: Package
        run: |
          ditto -c -k --keepParent "build/EngineOS Emulator.app" EngineOSEmulator-mac.zip
          unzip -p EngineOSEmulator-mac.zip "EngineOS Emulator.app/Contents/Info.plist" | grep -q "<string>${GITHUB_SHA::7}</string>" ||
            { echo "::error::the packaged app isn't build ${GITHUB_SHA::7}"; exit 1; }
      - name: Screenshot
        continue-on-error: true
        run: |
          # A copy of the app to look at, with self-update off (a test build never updates itself
          # anyway; this is belt and braces).
          defaults write io.github.jonathanrobichaud4.engineos-emulator autoUpdateApp -bool false
          ditto "build/EngineOS Emulator.app" "$RUNNER_TEMP/EngineOS Emulator.app"
          open "$RUNNER_TEMP/EngineOS Emulator.app"
          sleep 8
          osascript -e 'tell application "System Events" to set frontmost of (first process whose name is "EngineOSEmulator") to true' || true
          sleep 2
          screencapture -x screenshot.png
          pkill -x EngineOSEmulator || true
      - uses: actions/upload-artifact@v4
        with:
          name: EngineOSEmulator-mac
          path: |
            EngineOSEmulator-mac.zip
            screenshot.png
