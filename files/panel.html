<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EngineOS Emulator: SC LIVE 4</title>
<style>
:root{--bg:#0d0e10;--deck:#2a2d31;--deck2:#232528;--line:#3b3f45;--txt:#c9ccd1;--dim:#7d828a;--btn:#3a3d42;--btn2:#45494f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
header{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#16181b;border-bottom:1px solid #26292d}
header b{font-size:14px;color:#e6e8eb;margin-right:6px}
header button,header select{background:#2a2d32;color:#dfe2e6;border:1px solid #3a3e44;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
header button:hover{background:#33373d}
header button.on{background:#1f5f3a;border-color:#2f8a55}
header a{color:#8bb8ff;text-decoration:none}
#st{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
#stage{position:absolute;top:42px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#panel{position:relative;width:1900px;height:1080px;transform-origin:0 0;background:linear-gradient(#303338,#26282c);border-radius:18px;box-shadow:0 10px 40px #000a,inset 0 1px 0 #ffffff14}
.c{position:absolute;user-select:none;-webkit-user-select:none;touch-action:none}
.lab{position:absolute;left:-20px;right:-20px;text-align:center;font-size:10px;letter-spacing:.04em;color:var(--dim);pointer-events:none;white-space:nowrap}
.lab.below{top:calc(100% + 3px)}
.text{color:var(--dim);font-size:10px;letter-spacing:.06em;text-align:center}
.text.big{font-size:16px;color:#d8dbe0;font-weight:600}
.btn{border-radius:5px;background:var(--btn);border:1px solid #1d1f22;box-shadow:inset 0 1px 0 #ffffff1a,0 2px 0 #0006;display:flex;align-items:center;justify-content:center;color:#d6d9de;font-size:10px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn.small{font-size:8.5px}
.btn.big{font-size:14px}
.btn.round{border-radius:50%}
.btn.down{transform:translateY(1px);box-shadow:inset 0 1px 3px #0008}
.pad{border-radius:6px;background:#1c1e21;border:1px solid #111;box-shadow:inset 0 0 0 1px #ffffff12;color:#ffffff60;font-size:11px;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px 6px;cursor:pointer}
.pad.down{transform:scale(.97)}
.knob{border-radius:50%;background:radial-gradient(circle at 40% 35%,#55595f,#2c2f33 70%);box-shadow:0 2px 3px #0009,inset 0 1px 0 #ffffff22;cursor:ns-resize}
.knob .ptr{position:absolute;left:50%;top:6%;width:3px;height:38%;margin-left:-1.5px;background:#e9ecef;border-radius:2px;transform-origin:50% 115%}
.knob svg,.enc svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none}
.enc{border-radius:50%;background:repeating-conic-gradient(#3d4146 0 6deg,#2e3135 6deg 12deg);box-shadow:0 2px 3px #0009;cursor:ns-resize}
.enc .cap{position:absolute;inset:24%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a5e64,#2f3236);box-shadow:inset 0 1px 0 #ffffff22;cursor:pointer}
.enc .cap.down{background:#6b7077}
.btn.locked{background:#f0f2f5;color:#111;box-shadow:0 0 10px #f0f2f5}
.track{position:absolute;background:#121315;border-radius:3px;box-shadow:inset 0 1px 2px #000}
.cap2{position:absolute;background:linear-gradient(#cfd2d6,#8d9298);border-radius:3px;box-shadow:0 2px 3px #000a;cursor:grab}
.cap2::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;margin-top:-1px;background:#222}
.xcap::after{left:50%;right:auto;top:10%;bottom:10%;width:2px;height:auto;margin:0 0 0 -1px}
.jog{border-radius:50%;background:radial-gradient(circle,#2a2d31 0 46%,#1b1d20 47% 49%,repeating-conic-gradient(#3a3e44 0 2deg,#2c2f34 2deg 4deg) 50% 100%);box-shadow:0 6px 18px #000a,inset 0 0 0 2px #00000080;cursor:grab}
.jog .top{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 45% 40%,#3f444b,#1f2124);box-shadow:inset 0 0 0 2px #ffffff10}
.jog .mark{position:absolute;left:50%;top:2%;width:4px;height:12%;margin-left:-2px;background:#e8eaed;border-radius:2px;transform-origin:50% 400%}
.jog .info{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#9aa0a8;font-size:14px;font-weight:600;pointer-events:none}
.jog.touched .top{box-shadow:inset 0 0 0 3px #4aa3ff}
.jog canvas.lcd{position:absolute;inset:18%;width:64%;height:64%;border-radius:50%;pointer-events:none}
.sw{display:flex;border-radius:4px;overflow:hidden;border:1px solid #1d1f22;background:#1a1c1f}
.sw div{flex:1;display:flex;align-items:center;justify-content:center;font-size:8.5px;color:#8a9097;cursor:pointer}
.sw div.on{background:#5a5f66;color:#fff}
.sel{border-radius:50%;background:radial-gradient(circle at 40% 35%,#55595f,#2c2f33 70%);cursor:pointer;box-shadow:0 2px 3px #0009}
.sel .ptr{position:absolute;left:50%;top:8%;width:3px;height:40%;margin-left:-1.5px;background:#e9ecef;transform-origin:50% 105%}
.sel .opt{position:absolute;font-size:9px;color:#8a9097;width:14px;margin:-6px 0 0 -7px;text-align:center}
.sel .opt.on{color:#fff;font-weight:700}
.vu{display:flex;flex-direction:column-reverse;gap:2px}
.vu i{flex:1;border-radius:1px;background:#202225}
.screen{background:#000;border-radius:4px;box-shadow:0 0 0 10px #17181a,0 0 0 11px #3a3d42}
.screen canvas{width:100%;height:100%;display:block;cursor:pointer;border-radius:4px}
.mixbg{background:var(--deck2);border-radius:10px;box-shadow:inset 0 0 0 1px #ffffff0d}
dialog{background:#1b1d21;color:var(--txt);border:1px solid #33373d;border-radius:10px;min-width:520px;padding:18px}
dialog h3{margin:0 0 10px;font-size:15px;color:#e6e8eb}
dialog table{width:100%;border-collapse:collapse;margin:8px 0 14px}
dialog td{padding:6px 4px;border-bottom:1px solid #2a2d32}
dialog input,dialog select{background:#111316;color:#e6e8eb;border:1px solid #3a3e44;border-radius:6px;padding:6px 8px;font:inherit}
dialog button{background:#2a2d32;color:#dfe2e6;border:1px solid #3a3e44;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
dialog .row{display:flex;gap:8px;align-items:center;margin:6px 0}
dialog .err{color:#ff8a80;min-height:16px}
dialog .hint{color:var(--dim);font-size:11px;line-height:1.5}
</style></head><body>
<header>
  <b>EngineOS Emulator</b> <span id="model" style="color:var(--dim)">SC LIVE 4</span>
  <button id="listen" title="Play Engine's audio output in this browser">Listen</button>
  <select id="pair" title="Which output to hear"></select>
  <button id="drivesBtn">Drives</button>
  <button id="rebootBtn" title="Restart the whole emulated deck">Reboot</button>
  <a href="__CONSOLE__" target="_blank">EngineX console</a>
  <span id="st">connecting</span>
</header>
<div id="stage"><div id="panel"></div></div>

<dialog id="drives">
  <h3>Drives</h3>
  <div class="hint">A folder on this PC shows up on the deck as a USB drive or the SD card. Use Linux paths:
    your Windows <code>C:\Users\you\Music</code> is <code>/mnt/c/Users/you/Music</code>.
    Engine writes its <i>Engine Library</i> folder into it, like on a real drive.</div>
  <table id="dlist"></table>
  <div class="row"><input id="dfolder" placeholder="/mnt/c/Users/you/Music" style="flex:1">
    <select id="dkind"><option value="usb">USB drive</option><option value="sd">SD card</option></select>
    <input id="dlabel" placeholder="Label" size="10"></div>
  <div class="err" id="derr"></div>
  <div class="row" style="justify-content:flex-end"><button id="dadd">Plug in</button><button id="dclose">Close</button></div>
</dialog>

<script>
"use strict";
const $=s=>document.querySelector(s);
const panel=$("#panel"),st=$("#st");
let P=null,ctl={},values={},leds={},views={};
const post=(u,b)=>fetch(u,{method:"POST",body:b}).catch(()=>{});

// ---------------------------------------------------------------- events to the server
let q=[],busy=false;
// SHIFT: hold it, double-click to lock it on (click again to unlock), or hold Shift on the
// keyboard, which holds both decks' SHIFT. Engine sees one press until nothing holds it.
const shifts={};
function shiftSync(id){const s=shifts[id],on=s.mouse||s.key||s.locked;
  if(on!==s.sent){s.sent=on;send(id+(on?" press":" release"))}
  s.d.classList.toggle("down",on);s.d.classList.toggle("locked",s.locked);s.d.textContent=s.locked?"SHIFT \u{1F512}":"SHIFT"}
function shiftBtn(c,d){const s=shifts[c.id]={d,mouse:false,key:false,locked:false,sent:false,last:0};
  d.title="Hold for shift. Double-click to lock it on. The keyboard's Shift key works too.";
  d.addEventListener("pointerdown",e=>{e.preventDefault();d.setPointerCapture(e.pointerId);const t=performance.now();
    if(s.locked){s.locked=false;s.last=0}else if(t-s.last<350){s.locked=true;s.last=0}else{s.last=t}
    s.mouse=true;shiftSync(c.id)});
  const up=()=>{if(s.mouse){s.mouse=false;shiftSync(c.id)}};
  d.addEventListener("pointerup",up);d.addEventListener("pointercancel",up);
  views[c.id]={led(){}}}
const typing=e=>{const t=e.target;return t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable)};
addEventListener("keydown",e=>{if(e.key!=="Shift"||e.repeat||typing(e))return;for(const id in shifts){shifts[id].key=true;shiftSync(id)}});
addEventListener("keyup",e=>{if(e.key!=="Shift")return;for(const id in shifts){shifts[id].key=false;shiftSync(id)}});
addEventListener("blur",()=>{for(const id in shifts){if(shifts[id].key){shifts[id].key=false;shiftSync(id)}}});
function send(line){q.push(line);if(!busy)flush()}
async function flush(){busy=true;while(q.length){const b=q.splice(0).join("\n");await post("/control",b)}busy=false}

// ---------------------------------------------------------------- layout scaling
function fit(){panel.style.width=P.w+"px";panel.style.height=P.h+"px";const s=$("#stage"),k=Math.min(s.clientWidth/P.w,s.clientHeight/P.h)*0.985;
  panel.style.transform=`scale(${k})`;panel.style.position="absolute";
  panel.style.left=((s.clientWidth-P.w*k)/2)+"px";panel.style.top=((s.clientHeight-P.h*k)/2)+"px";panel._k=k}
addEventListener("resize",()=>P&&fit());

function el(c,cls){const d=document.createElement("div");d.className="c "+(cls||"");
  Object.assign(d.style,{left:c.x+"px",top:c.y+"px",width:c.w+"px",height:c.h+"px"});panel.appendChild(d);return d}
function label(d,text,below=true){if(!text)return;const l=document.createElement("div");l.className="lab"+(below?" below":"");l.textContent=text;d.appendChild(l)}
function drag(d,onMove,onDown,onUp){d.addEventListener("pointerdown",e=>{e.preventDefault();d.setPointerCapture(e.pointerId);
  let last={x:e.clientX,y:e.clientY};onDown&&onDown(e);
  const mv=e2=>{onMove(e2,(e2.clientX-last.x)/panel._k,(e2.clientY-last.y)/panel._k);last={x:e2.clientX,y:e2.clientY}};
  const up=e2=>{d.removeEventListener("pointermove",mv);d.removeEventListener("pointerup",up);d.removeEventListener("pointercancel",up);onUp&&onUp(e2)};
  d.addEventListener("pointermove",mv);d.addEventListener("pointerup",up);d.addEventListener("pointercancel",up)})}
const arcSvg=()=>'<svg viewBox="-60 -60 120 120"><path d="" fill="none" stroke="#4aa3ff" stroke-width="7" stroke-linecap="round"/></svg>';
function arcPath(f,center){const a0=-135,a=a0+270*f,c=center?0:-135;const s=Math.min(a,c),e=Math.max(a,c);
  if(e-s<.5)return"";const r=56,p=t=>[Math.sin(t*Math.PI/180)*r,-Math.cos(t*Math.PI/180)*r];
  const[x1,y1]=p(s),[x2,y2]=p(e);return`M${x1} ${y1}A${r} ${r} 0 ${e-s>180?1:0} 1 ${x2} ${y2}`}

// ---------------------------------------------------------------- controls
const builders={
 screen(c){const d=el(c,"screen");const cv=document.createElement("canvas");cv.width=1280;cv.height=800;d.appendChild(cv);screen(cv)},
 panel(c){el(c,"mixbg")},
 label(c){const d=el(c,"text"+(c.big?" big":""));d.textContent=c.lab},
 btn(c){const d=el(c,"btn"+(c.round?" round":"")+(c.small?" small":"")+(c.big?" big":""));d.textContent=c.lab;
  if(/_shift$/.test(c.id))return shiftBtn(c,d);
  d.addEventListener("pointerdown",e=>{e.preventDefault();d.setPointerCapture(e.pointerId);d.classList.add("down");send(c.id+" press")});
  const up=()=>{if(d.classList.contains("down")){d.classList.remove("down");send(c.id+" release")}};
  d.addEventListener("pointerup",up);d.addEventListener("pointercancel",up);
  views[c.id]={led(v){const col=c.col||"#f0f2f5";if(!v){d.style.background="";d.style.color="";d.style.boxShadow="";return}
    const a=v>=64?1:.45;d.style.background=mix(col,a);d.style.color=a>.6?"#111":"#fff";d.style.boxShadow=`0 0 ${10*a}px ${col}`}}},
 pad(c){const d=el(c,"pad");d.textContent=c.lab;
  d.addEventListener("pointerdown",e=>{e.preventDefault();d.setPointerCapture(e.pointerId);d.classList.add("down");send(c.id+" press")});
  const up=()=>{if(d.classList.contains("down")){d.classList.remove("down");send(c.id+" release")}};
  d.addEventListener("pointerup",up);d.addEventListener("pointercancel",up);
  views[c.id]={led(v){if(!v){d.style.background="";d.style.boxShadow="";return}
    const r=(v>>4)&3,g=(v>>2)&3,b=v&3,col=`rgb(${r*85},${g*85},${b*85})`;
    d.style.background=col;d.style.boxShadow=`0 0 14px ${col},inset 0 0 0 1px #ffffff40`}}},
 knob(c){const d=el(c,"knob");d.innerHTML=arcSvg()+'<div class="ptr"></div>';label(d,c.lab);
  const ptr=d.querySelector(".ptr"),arc=d.querySelector("path"),center=(c.d===64);
  const show=v=>{const f=v/127;ptr.style.transform=`rotate(${-135+270*f}deg)`;arc.setAttribute("d",arcPath(f,center))};
  let v=values[c.id]??c.d??0;show(v);
  const set=nv=>{nv=Math.max(0,Math.min(127,Math.round(nv)));if(nv!==v){v=nv;show(v);send(`${c.id} set ${v}`)}};
  drag(d,(e,dx,dy)=>set(v-dy*0.7+dx*0.2));
  d.addEventListener("wheel",e=>{e.preventDefault();set(v+(e.deltaY<0?3:-3))},{passive:false});
  d.addEventListener("dblclick",()=>set(c.d??0));
  views[c.id]={value(nv){v=nv;show(v)}}},
 enc(c){const d=el(c,"enc");d.innerHTML='<div class="cap"></div>';label(d,c.lab);const cap=d.querySelector(".cap");
  let acc=0,rot=0;const turn=n=>{rot+=n*15;d.style.backgroundImage=`repeating-conic-gradient(from ${rot}deg,#3d4146 0 6deg,#2e3135 6deg 12deg)`;send(`${c.id} turn ${n}`)};
  // Drag anywhere on it to turn. A click without moving pushes it; holding still holds the push.
  let moved=0,pushed=false,holdT=0;
  const push=()=>{if(!pushed&&c.push!=null){pushed=true;cap.classList.add("down");send(c.id+" press")}};
  drag(d,(e,dx,dy)=>{moved+=Math.abs(dx)+Math.abs(dy);if(moved<4)return;clearTimeout(holdT);
      acc+=(-dy+dx)/7;const n=Math.trunc(acc);if(n){acc-=n;turn(n)}},
    ()=>{moved=0;acc=0;clearTimeout(holdT);holdT=setTimeout(()=>{if(moved<4)push()},350)},
    ()=>{clearTimeout(holdT);if(moved<4&&!pushed)push();
      if(pushed){setTimeout(()=>{cap.classList.remove("down");send(c.id+" release");pushed=false},pushed?60:0)}});
  d.addEventListener("wheel",e=>{e.preventDefault();turn(e.deltaY<0?1:-1)},{passive:false});
  views[c.id]={led(v){cap.style.boxShadow=v?"0 0 10px #4aa3ff,inset 0 0 0 2px #4aa3ff":""}}},
 fader(c){vfader(c,127,true)},
 pitch(c){vfader(c,16383,false)},
 xfader(c){const d=el(c);const tr=document.createElement("div");tr.className="track";Object.assign(tr.style,{left:"0",right:"0",top:(c.h/2-3)+"px",height:"6px"});d.appendChild(tr);
  const cap=document.createElement("div");cap.className="cap2 xcap";Object.assign(cap.style,{width:"26px",top:"0",height:c.h+"px"});d.appendChild(cap);
  let v=values[c.id]??c.d??64;const show=()=>cap.style.left=(v/127*(c.w-26))+"px";show();
  const set=nv=>{nv=Math.max(0,Math.min(127,Math.round(nv)));if(nv!==v){v=nv;show();send(`${c.id} set ${v}`)}};
  drag(d,(e,dx)=>set(v+dx*127/(c.w-26)));d.addEventListener("dblclick",()=>set(64));
  views[c.id]={value(nv){v=nv;show()}}},
 jog(c){const d=el(c,"jog");d.innerHTML='<div class="top"></div><canvas class="lcd" width="320" height="320"></canvas><div class="mark"></div><div class="info"><span>'+c.lab+'</span></div>';
  const lcd=d.querySelector("canvas.lcd"),info=d.querySelector(".info");
  const mark=d.querySelector(".mark"),TPR=2048;let pos=0,touching=false;
  const show=()=>mark.style.transform=`rotate(${pos/TPR*360}deg)`;
  const ang=e=>{const r=d.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))};
  let a0=0,acc=0;
  drag(d,e=>{const a=ang(e);let da=a-a0;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;a0=a;
      acc+=da/(2*Math.PI)*TPR;const n=Math.trunc(acc);if(n){acc-=n;pos+=n;show();send(`${c.id} spin ${n}`)}},
    e=>{a0=ang(e);const r=d.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
      touching=Math.hypot(dx,dy)<r.width*0.34;if(touching){d.classList.add("touched");send(c.id+" press")}},
    ()=>{if(touching){touching=false;d.classList.remove("touched");send(c.id+" release")}});
  d.addEventListener("wheel",e=>{e.preventDefault();const n=e.deltaY<0?24:-24;pos+=n;show();send(`${c.id} spin ${n}`)},{passive:false});
  views[c.id]={jog(st){const on=drawJogLcd(lcd,c.ch,st);info.style.display=on?"none":"flex"}}},
 sw(c){const d=el(c,"sw");label(d,c.labs?"":c.lab);
  const parts=c.labs.map((t,i)=>{const p=document.createElement("div");p.textContent=t;p.onclick=()=>{set(i)};d.appendChild(p);return p});
  let v=values[c.id]??c.d??0;const show=()=>parts.forEach((p,i)=>p.classList.toggle("on",i===v));show();
  const set=i=>{v=i;show();send(`${c.id} set ${i}`)};
  if(c.lab&&c.lab!==c.labs[1]){const l=document.createElement("div");l.className="lab below";l.textContent=c.lab;d.appendChild(l)}
  views[c.id]={value(nv){v=nv;show()}}},
 sel(c){const d=el(c,"sel");d.innerHTML='<div class="ptr"></div>';label(d,c.lab);const ptr=d.querySelector(".ptr");
  const n=c.vals.length,angs=c.labs.map((_,i)=>-60+120*i/(n-1));
  const opts=c.labs.map((t,i)=>{const o=document.createElement("div");o.className="opt";o.textContent=t;const a=angs[i]*Math.PI/180,R=c.w/2+11;
    o.style.left=(c.w/2+Math.sin(a)*R)+"px";o.style.top=(c.h/2-Math.cos(a)*R)+"px";d.appendChild(o);return o});
  let v=values[c.id]??c.d??0;const show=()=>{ptr.style.transform=`rotate(${angs[v]}deg)`;opts.forEach((o,i)=>o.classList.toggle("on",i===v))};show();
  const set=i=>{v=(i+n)%n;show();send(`${c.id} set ${v}`)};
  d.addEventListener("click",e=>set(e.shiftKey?v-1:v+1));d.addEventListener("wheel",e=>{e.preventDefault();set(v+(e.deltaY<0?1:-1))},{passive:false});
  views[c.id]={value(nv){v=nv;show()}}},
 vu(c){const d=el(c,"vu");const N=c.segs||6,segs=[];for(let i=0;i<N;i++){const s=document.createElement("i");d.appendChild(s);segs.push(s)}
  const cols=segs.map((s,i)=>i>=N-1?"#ff4b3e":i>=N-2?"#ffb02e":"#2bd46a");
  // SC LIVE 4 meters light one bit per segment; Prime 4 ones (inc) send a level 0-127.
  views[c.id]={cc(v){let n=0;if(c.inc)n=Math.round(v/127*N);else for(let b=v;b;b>>=1)n+=b&1;segs.forEach((s,i)=>s.style.background=i<n?cols[i]:"")}}},
};
function vfader(c,max,topIsMax){const d=el(c);const tr=document.createElement("div");tr.className="track";Object.assign(tr.style,{top:"0",bottom:"0",left:(c.w/2-3)+"px",width:"6px"});d.appendChild(tr);
  if(!topIsMax){const m=document.createElement("div");Object.assign(m.style,{position:"absolute",left:"-6px",right:"-6px",top:(c.h/2-1)+"px",height:"2px",background:"#555"});d.appendChild(m);
    const led=document.createElement("div");Object.assign(led.style,{position:"absolute",left:"-12px",top:(c.h/2-4)+"px",width:"8px",height:"8px",borderRadius:"50%",background:"#222"});d.appendChild(led);
    views[c.id+"#led"]=led}
  const capH=22,cap=document.createElement("div");cap.className="cap2";Object.assign(cap.style,{left:"-4px",right:"-4px",height:capH+"px"});d.appendChild(cap);label(d,c.lab);
  let v=values[c.id]??(topIsMax?c.d??0:8192);const span=c.h-capH;
  const show=()=>cap.style.top=((topIsMax?1-v/max:v/max)*span)+"px";show();
  const set=nv=>{nv=Math.max(0,Math.min(max,Math.round(nv)));if(nv!==v){v=nv;show();send(`${c.id} set ${v}`)}};
  drag(d,(e,dx,dy)=>set(v+(topIsMax?-1:1)*dy*max/span));
  d.addEventListener("dblclick",()=>set(topIsMax?(c.d??0):8192));
  d.addEventListener("wheel",e=>{e.preventDefault();set(v+(e.deltaY<0?1:-1)*(topIsMax?-1:1)*-max/64)},{passive:false});
  views[c.id]=Object.assign(views[c.id]||{},{value(nv){v=nv;show()}})}
function mix(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,k=x=>Math.round(0x3a+(x-0x3a)*a);return`rgb(${k(r)},${k(g)},${k(b)})`}

// ---------------------------------------------------------------- jog displays
// The SC LIVE 4's jog centres are segment LCDs that Engine drives over MIDI
// (ControlSurfaceModules/LcdWheelDisplay.qml), on the deck's channel:
//   CC 0x30 position ring: 1-48 lights that segment, +64 inverts (all but that one), 0 off
//   CC 0x31-0x34 ring quadrants top/right/left/bottom, 0x35/0x36 top/bottom box, 0x37 "DECK",
//   0x39 "BPM", 0x3a time label, 0x3c dividing line, 0x3e BPM digits, 0x3f time digits
//   note 0x38: the active deck number as velocity; the time and BPM come as SysEx (viewer.py).
let jogs={};
const LCD_ON="#e9f1ff",LCD_DIM="#1b2027";
function drawJogLcd(cv,ch,st){
  const L=k=>leds[`c${ch}.${k}`]||0,g=cv.getContext("2d"),W=cv.width,R=W/2;
  const needle=L(0x30),any=needle||L(0x31)||L(0x35)||L(0x37)||L(0x3e)||L(0x3f);
  g.clearRect(0,0,W,W);
  if(!any)return false;
  g.save();g.translate(R,R);
  g.fillStyle="#05070a";g.beginPath();g.arc(0,0,R,0,7);g.fill();
  // position ring, 48 segments from 12 o'clock clockwise
  const seg=needle&63,inv=needle>=64,N=48;
  for(let i=1;i<=N;i++){
    const lit=needle?(inv?i!==seg:i===seg):false;
    const a0=-Math.PI/2+(i-1)/N*2*Math.PI+0.012,a1=a0+2*Math.PI/N-0.024;
    g.strokeStyle=lit?LCD_ON:LCD_DIM;g.lineWidth=R*0.09;g.beginPath();g.arc(0,0,R*0.9,a0,a1);g.stroke()}
  // inner ring quadrants
  const quad=[[0x31,-Math.PI*0.75],[0x32,-Math.PI*0.25],[0x34,Math.PI*0.25],[0x33,Math.PI*0.75]];
  for(const[k,a]of quad){g.strokeStyle=L(k)?LCD_ON:LCD_DIM;g.lineWidth=R*0.025;g.beginPath();g.arc(0,0,R*0.76,a+0.04,a+Math.PI/2-0.04);g.stroke()}
  g.textAlign="center";g.textBaseline="middle";g.fillStyle=LCD_ON;g.strokeStyle=LCD_ON;
  // top box: DECK and the deck number
  if(L(0x35)){g.lineWidth=R*0.02;g.strokeRect(-R*0.36,-R*0.62,R*0.72,R*0.5)}
  if(L(0x37)){g.font=`600 ${R*0.11}px system-ui,sans-serif`;g.fillText("DECK",0,-R*0.52)}
  const deck=leds[`n${ch}.56`];if(deck){g.font=`700 ${R*0.3}px system-ui,sans-serif`;g.fillText(String(deck),0,-R*0.28)}
  if(L(0x3c)){g.lineWidth=R*0.02;g.beginPath();g.moveTo(-R*0.6,-R*0.04);g.lineTo(R*0.6,-R*0.04);g.stroke()}
  // BPM
  if(L(0x3e)&&st&&st.bpm!=null){g.font=`700 ${R*0.17}px ui-monospace,Menlo,Consolas,monospace`;g.fillText(st.bpm.toFixed(1),-R*0.08,R*0.12)}
  if(L(0x39)||L(0x3e)){g.font=`600 ${R*0.08}px system-ui,sans-serif`;g.fillText("BPM",R*0.4,R*0.14)}
  // time, bottom box
  if(L(0x36)){g.lineWidth=R*0.02;g.strokeRect(-R*0.42,R*0.26,R*0.84,R*0.26)}
  if(L(0x3f)&&st&&st.time){const t=st.time,m=t.h*60+t.m;
    g.font=`700 ${R*0.15}px ui-monospace,Menlo,Consolas,monospace`;
    g.fillText(`${t.minus?"-":""}${m}:${String(t.s).padStart(2,"0")}.${Math.floor(t.cs/10)}`,0,R*0.39)}
  g.restore();return true}

// ---------------------------------------------------------------- LEDs and values from the server
function applyLeds(){
  for(const c of P.controls){if(!c.id)continue;const v=views[c.id];if(!v)continue;
    if(c.hw){if(v.led)v.led(values[c.id]?127:0);continue}  // the emulator's own mixer controls
    const D=c.dev?`d${c.dev}`:"";  // which of the deck's MIDI devices (Prime 4: 1 = mixer)
    if(v.led){const key=c.t==="enc"?`${D}n${c.ch}.${c.push}`:`${D}n${c.ch}.${c.n}`;v.led(leds[key]||0)}
    if(v.cc)v.cc(leds[`${D}c${c.ch}.${c.cc}`]||0);
    if(c.t==="pitch"&&views[c.id+"#led"]){views[c.id+"#led"].style.background=leds[`${D}n${c.ch}.${c.led}`]?"#ff4b3e":"#222"}
    if(v.jog)v.jog(jogs[String(c.ch)])}}
async function stateLoop(){let seq=-1,first=true;
  for(;;){try{const r=await fetch("/state?since="+seq,{cache:"no-store"});const s=await r.json();
      if(s.seq!==seq||first){seq=s.seq;leds=s.leds;jogs=s.jog||{};if(first){values=s.values;for(const[k,v]of Object.entries(values))views[k]?.value?.(v);first=false}else if(s.values)Object.assign(values,s.values);applyLeds()}}
    catch(e){await new Promise(r=>setTimeout(r,1000))}}}

// ---------------------------------------------------------------- screen
function screen(cv){const g=cv.getContext("2d");let seq=0,img=null,frames=0,t0=performance.now();
  (async()=>{for(;;){try{const r=await fetch("/frame?since="+seq,{cache:"no-store"});if(r.status===204)continue;
      const b=await r.arrayBuffer(),h=new DataView(b);seq=h.getUint32(0,true);const w=h.getUint32(4,true),hh=h.getUint32(8,true),bpl=h.getUint32(12,true);
      if(cv.width!==w||cv.height!==hh){cv.width=w;cv.height=hh;img=null}if(!img)img=g.createImageData(w,hh);
      const src=new Uint8Array(b,16),dst=img.data;
      for(let y=0;y<hh;y++){let s=y*bpl,d=y*w*4;for(let x=0;x<w;x++,s+=4,d+=4){dst[d]=src[s+2];dst[d+1]=src[s+1];dst[d+2]=src[s];dst[d+3]=255}}
      g.putImageData(img,0,0);frames++;const t=performance.now();if(t-t0>1000){st.textContent=(frames*1000/(t-t0)).toFixed(1)+" fps";frames=0;t0=t}}
    catch(e){st.textContent="waiting for Engine";await new Promise(r=>setTimeout(r,1000))}}})();
  const pos=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*cv.width/r.width),Math.round((e.clientY-r.top)*cv.height/r.height)]};
  let down=false,tq=[],tb=false;const ts=l=>{tq.push(l);if(!tb)tf()};
  const tf=async()=>{tb=true;while(tq.length){await post("/input",tq.splice(0).join("\n")+"\n")}tb=false};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);down=true;const[x,y]=pos(e);ts(`down ${x} ${y}`)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const[x,y]=pos(e);ts(`move ${x} ${y}`)});
  cv.addEventListener("pointerup",e=>{if(!down)return;down=false;const[x,y]=pos(e);ts(`up ${x} ${y}`)});
  cv.addEventListener("wheel",e=>{e.preventDefault();const[x,y]=pos(e);ts(`wheel ${x} ${y} ${e.deltaY<0?120:-120}`)},{passive:false})}

// ---------------------------------------------------------------- audio
let actx=null,playing=false;
// Engine under emulation sometimes delivers audio late (it is busy drawing, or the host is).
// The player keeps a buffer that starts at 0.25 s and grows by 0.1 s (up to 1 s) every time it
// runs dry, so stalls stop being audible after the first one or two; a fresh start after a
// gap fades in over 5 ms instead of clicking.
async function audioLoop(){let pos=0,next=0,target=0.25,fresh=true;
  while(playing){try{const r=await fetch("/audio?pos="+pos,{cache:"no-store"});const b=await r.arrayBuffer();const h=new DataView(b);
      const np=Number(h.getBigUint64(0,true)),rate=h.getUint32(8,true),n=(b.byteLength-12)/4;
      if(!rate||!n){await new Promise(r=>setTimeout(r,200));continue}
      pos=np;if(!actx||actx.sampleRate!==rate){actx&&actx.close();actx=new AudioContext({sampleRate:rate,latencyHint:"playback"});next=0}
      const s=new Int16Array(b,12,n*2),buf=actx.createBuffer(2,n,rate),L=buf.getChannelData(0),R=buf.getChannelData(1);
      // Panels with their own MASTER / PHONES knobs (Prime 4) set the listening volume of those outputs.
      const g=outGain();let pl=0,pr=0;
      for(let i=0;i<n;i++){L[i]=s[2*i]/32768*g;R[i]=s[2*i+1]/32768*g;pl=Math.max(pl,Math.abs(L[i]));pr=Math.max(pr,Math.abs(R[i]))}
      meter(pl,pr);
      const now=actx.currentTime;
      if(next<now+0.01){if(next)target=Math.min(1,target+0.1);next=now+target;fresh=true}
      else if(next>now+target+0.5)next=now+target,fresh=true;
      if(fresh){const f=Math.min(n,Math.round(rate*0.005));for(let i=0;i<f;i++){L[i]*=i/f;R[i]*=i/f}fresh=false}
      const src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);src.start(next);next+=n/rate}
    catch(e){await new Promise(r=>setTimeout(r,500))}}}
$("#listen").onclick=()=>{playing=!playing;$("#listen").classList.toggle("on",playing);$("#listen").textContent=playing?"Listening":"Listen";
  if(playing)audioLoop();else if(actx){actx.close();actx=null}};
const PAIRS={"hw:1":["Main","Booth","Phones","Out 7/8"]};
// Which output is being listened to (its name from P.outs / PAIRS), and the knob that sets its volume.
function outName(){const o=$("#pair").selectedOptions[0];return o?o.textContent.split(" (")[0]:""}
function outGain(){const k=outName()==="Main"?"master":outName()==="Phones"?"phones":null;
  if(!k||values[k]===undefined||!P||!P.controls.some(c=>c.id===k))return 1;return Math.pow(values[k]/100,2)}
// The main meters (Prime 4) show the level of what's playing in the browser, in dB from -40.
let mlast=0;function meter(l,r){const t=performance.now();if(t-mlast<50)return;mlast=t;
  const db=v=>v>0?Math.max(0,Math.min(127,(20*Math.log10(v)+40)/40*127)):0;views.vuL?.cc?.(db(l));views.vuR?.cc?.(db(r))}
async function loadPairs(){try{const r=await(await fetch("/audio-devices")).json();const s=$("#pair");s.innerHTML="";
    for(const d of r.devices)for(let p=0;p+1<d.channels;p+=2){const o=document.createElement("option");o.value=`${d.index} ${p} ${p+1}`;
      o.textContent=`${(P&&P.outs||PAIRS[d.name]||[])[p/2]||"Out "+(p+1)+"/"+(p+2)} (${d.name} ${p+1}/${p+2})`;s.appendChild(o)}
    if(r.select)s.value=r.select.join(" ")}catch(e){}}
$("#pair").onchange=e=>post("/audio-select",e.target.value);

// ---------------------------------------------------------------- drives, reboot
async function drivesShow(list){list=list||await(await fetch("/drives")).json();const t=$("#dlist");t.innerHTML="";
  if(!list.length)t.innerHTML='<tr><td class="hint">Nothing plugged in.</td></tr>';
  for(const d of list){const tr=document.createElement("tr");tr.innerHTML=`<td><b></b></td><td></td><td></td><td></td>`;
    tr.children[0].firstChild.textContent=d.label;tr.children[1].textContent=d.kind==="sd"?"SD card":"USB drive";tr.children[2].textContent=d.folder+(d.ok?"":" (missing)");
    const b=document.createElement("button");b.textContent="Eject";b.onclick=async()=>{const r=await fetch("/drives",{method:"POST",body:JSON.stringify({action:"remove",label:d.label})});drivesShow((await r.json()).drives)};
    tr.children[3].appendChild(b);t.appendChild(tr)}}
$("#drivesBtn").onclick=()=>{$("#derr").textContent="";drivesShow();$("#drives").showModal()};
$("#dclose").onclick=()=>$("#drives").close();
$("#dadd").onclick=async()=>{const r=await fetch("/drives",{method:"POST",body:JSON.stringify({folder:$("#dfolder").value.trim(),kind:$("#dkind").value,label:$("#dlabel").value.trim()})});
  const j=await r.json();$("#derr").textContent=j.error||"";if(!j.error){$("#dfolder").value="";$("#dlabel").value=""}drivesShow(j.drives)};
$("#rebootBtn").onclick=async()=>{if(!confirm("Reboot the emulated deck? Engine takes a minute or two to come back."))return;
  await post("/reboot","");st.textContent="rebooting...";setTimeout(()=>location.reload(),15000)};

// ---------------------------------------------------------------- start
(async()=>{P=await(await fetch("/panel.json")).json();
  if(P.name){$("#model").textContent=P.name;document.title="EngineOS Emulator: "+P.name}
  try{values=(await(await fetch("/state?since=-2")).json()).values}catch(e){}
  for(const c of P.controls)(builders[c.t]||(()=>{}))(c);
  fit();stateLoop();loadPairs();setInterval(loadPairs,10000)})();
</script></body></html>
